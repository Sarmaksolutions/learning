[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/payment_success.html"
  to = "/payment_success.html"
  status = 200
  force = false

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
