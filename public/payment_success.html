<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | SARMAK Learning</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 620px;
            background: #111111;
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        }

        .logo {
            width: 150px;
            max-width: 70%;
            margin-bottom: 25px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #d4af37;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
        }

        h1 {
            color: #d4af37;
            margin: 0 0 15px;
            font-size: 32px;
        }

        .message {
            color: #dddddd;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .order-box {
            background: #181818;
            border-radius: 10px;
            padding: 15px;
            margin: 25px 0;
            word-break: break-all;
        }

        .order-label {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .order-id {
            color: #d4af37;
            font-weight: bold;
            font-size: 15px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 28px;
            background: #d4af37;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .home-btn:hover {
            background: #f0d66b;
            transform: translateY(-1px);
        }

        .note {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            color: #ff7777;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="/logo.png"
        alt="SARMAK Solutions"
        class="logo"
        onerror="this.style.display='none'"
    >

    <div class="success-icon">✓</div>

    <h1>Payment Successful!</h1>

    <div class="message">
        Thank you for registering with
        <strong>SARMAK Learning</strong>.
        <br><br>
        Your payment has been received successfully.
    </div>

    <div class="order-box">
        <div class="order-label">Order ID</div>
        <div class="order-id" id="orderId">
            Loading...
        </div>
    </div>

    <a href="/" class="home-btn">
        Back to Home
    </a>

    <div class="note">
        Please keep your Order ID for future reference.
    </div>

</div>

<script>
    // Get order_id from Cashfree redirect URL
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order_id");

    const orderElement = document.getElementById("orderId");

    if (orderId) {
        orderElement.textContent = orderId;
    } else {
        orderElement.textContent = "Not available";
        orderElement.classList.add("error");
    }
</script>

</body>
</html>
